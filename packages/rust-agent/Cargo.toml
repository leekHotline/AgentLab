[package]
name = "rust-agent"
version = "1.0.0"
edition = "2021"
authors = ["AgentLab Team"]
description = "High-performance Rust agent for computation tasks"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[[bin]]
name = "rust-agent"
path = "src/main.rs"
